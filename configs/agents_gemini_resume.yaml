# Use only after the active Groq run exits. This resumes from the shared
# checkpoint and audits only identities absent from the audited-label Parquet.
llm:
  provider: "gemini"
  subagent_model: "gemini-3.5-flash-lite"
  temperature: 0.1
  max_tokens: 768
  max_retries: 3
  request_timeout_seconds: 90
  min_request_interval_seconds: 6
  rate_limit_delay_seconds: 2

audit:
  dataset_path: "data/processed/audit_train_sample_1000_from_5000.parquet"
  sample_size: 1000
  batch_size: 2
  random_seed: 42
  checkpoint_frequency: 5
  output_dir: "outputs/results/audited_train_1000_onecall"
  output_parquet: "data/processed/audited_train_1000_onecall_labels.parquet"

roles:
  audit_protocol: "single model call produces policy, data, pattern, and Judge perspectives; perspectives are not independent agents"
